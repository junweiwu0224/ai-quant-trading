services:
  dashboard:
    build:
      context: .
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DECISION_WORKER_ENABLED=${DECISION_WORKER_ENABLED:-false}
      - PI_AGENT_WORKER_ENABLED=${PI_AGENT_WORKER_ENABLED:-false}
      - AI_LLM_PROTOCOL=pi_agent
      - PI_AGENT_COMMAND=pi
      - PI_AGENT_MODEL=${PI_AGENT_MODEL:-}
      - AI_INLINE_EXECUTION=false
      - QUANT_SYSTEM_API_KEY=${QUANT_SYSTEM_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
      - QLIB_SERVICE_HOST=${QLIB_SERVICE_HOST:-127.0.0.1}
      - DASHBOARD_BACKGROUND_WORKER=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    command: ["python", "scripts/run_worker.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - DECISION_WORKER_ENABLED=${DECISION_WORKER_ENABLED:-false}
      - DECISION_EXTERNAL_DELIVERY_ENABLED=${DECISION_EXTERNAL_DELIVERY_ENABLED:-false}
      - DECISION_REPORT_BASE_URL=${DECISION_REPORT_BASE_URL:-}
      - DECISION_BACKUP_DIR=/app/data/backups/daily
      - DECISION_RECOVERY_DRILL_DIR=/app/data/backups/monthly-recovery
      - DECISION_ARTIFACT_DIRS=/app/data/decision-artifacts
      - DASHBOARD_BACKGROUND_WORKER=false
      - DAILY_BRIEF_WEBHOOK_URL=${DAILY_BRIEF_WEBHOOK_URL:-}
      - QUANT_SYSTEM_API_KEY=${QUANT_SYSTEM_API_KEY:-}
    healthcheck:
      disable: true
    restart: unless-stopped

  pi-agent:
    build:
      context: .
      target: pi-agent
    profiles:
      - ai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - PI_AGENT_WORKER_ENABLED=${PI_AGENT_WORKER_ENABLED:-false}
      - AI_LLM_PROTOCOL=pi_agent
      - PI_AGENT_COMMAND=pi
      - PI_AGENT_MODEL=${PI_AGENT_MODEL:-}
      - PI_AGENT_TIMEOUT_SECONDS=${PI_AGENT_TIMEOUT_SECONDS:-90}
      - PI_AGENT_WORKER_LEASE_TTL_SECONDS=${PI_AGENT_WORKER_LEASE_TTL_SECONDS:-30}
      - PI_AGENT_WORKER_POLL_INTERVAL_SECONDS=${PI_AGENT_WORKER_POLL_INTERVAL_SECONDS:-2}
      - PI_AGENT_WORKER_BATCH_SIZE=${PI_AGENT_WORKER_BATCH_SIZE:-4}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DASHBOARD_BACKGROUND_WORKER=false
    healthcheck:
      disable: true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

  paper:
    build: .
    command: ["python", "scripts/run_paper.py", "-s", "dual_ma", "-c", "000001", "-c", "600519"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading
    healthcheck:
      disable: true

  live:
    build: .
    command: ["python", "scripts/run_live.py", "-s", "dual_ma", "-c", "000001"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading
    healthcheck:
      disable: true

  backtest:
    build: .
    command: ["python", "scripts/run_backtest.py", "-s", "dual_ma", "-c", "000001"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading
