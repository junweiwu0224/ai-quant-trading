services:
  dashboard:
    build:
      context: .
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    ports:
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_WORKER_ENABLED=${AI_WORKER_ENABLED:-false}
      - AI_INLINE_EXECUTION=false
      - QUANT_SYSTEM_API_KEY=${QUANT_SYSTEM_API_KEY:-}
      - APP_ENV=${APP_ENV:-development}
      - QLIB_SERVICE_HOST=${QLIB_SERVICE_HOST:-0.0.0.0}
      - DASHBOARD_BACKGROUND_WORKER=false
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        INSTALL_OPTIONAL_AI: ${INSTALL_OPTIONAL_AI:-false}
    command: ["python", "scripts/run_worker.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - DECISION_WORKER_ENABLED=${DECISION_WORKER_ENABLED:-false}
      - DECISION_EXTERNAL_DELIVERY_ENABLED=${DECISION_EXTERNAL_DELIVERY_ENABLED:-false}
      - DECISION_REPORT_BASE_URL=${DECISION_REPORT_BASE_URL:-}
      - DECISION_BACKUP_DIR=/app/data/backups/daily
      - DECISION_RECOVERY_DRILL_DIR=/app/data/backups/monthly-recovery
      - DECISION_ARTIFACT_DIRS=/app/data/decision-artifacts
      - DASHBOARD_BACKGROUND_WORKER=false
      - DAILY_BRIEF_WEBHOOK_URL=${DAILY_BRIEF_WEBHOOK_URL:-}
      - QUANT_SYSTEM_API_KEY=${QUANT_SYSTEM_API_KEY:-}
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      args:
        INSTALL_OPTIONAL_AI: "true"
    command: ["python", "scripts/run_ai_worker.py"]
    profiles:
      - ai
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - AI_WORKER_ENABLED=${AI_WORKER_ENABLED:-false}
      - AI_WORKER_LEASE_TTL_SECONDS=${AI_WORKER_LEASE_TTL_SECONDS:-30}
      - AI_WORKER_POLL_INTERVAL_SECONDS=${AI_WORKER_POLL_INTERVAL_SECONDS:-2}
      - AI_WORKER_BATCH_SIZE=${AI_WORKER_BATCH_SIZE:-4}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DASHBOARD_BACKGROUND_WORKER=false
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - dashboard
    restart: unless-stopped

  paper:
    build: .
    command: ["python", "scripts/run_paper.py", "-s", "dual_ma", "-c", "000001", "-c", "600519"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading

  live:
    build: .
    command: ["python", "scripts/run_live.py", "-s", "dual_ma", "-c", "000001"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading

  backtest:
    build: .
    command: ["python", "scripts/run_backtest.py", "-s", "dual_ma", "-c", "000001"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
    profiles:
      - trading
